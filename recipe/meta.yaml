{% set version = "8.6.1" %}

package:
  name: importlib-metadata
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/i/importlib_metadata/importlib_metadata-{{ version }}.tar.gz
  sha256: 310b41d755445d74569f993ccfc22838295d9fe005425094fad953d7f15c8580

build:
  number: 0
  noarch: python

outputs:
  - name: importlib-metadata
    script: build_base.sh
    requirements:
      build:
        - python                                 # [build_platform != target_platform]
        - cross-python_{{ target_platform }}     # [build_platform != target_platform]
      host:
        - python
        - pip
        - setuptools
        - setuptools_scm !=6.1.0
      run:
        - python
        - zipp >=0.5
    test:
      downstream:
        - setuptools

  - name: importlib_metadata
    requirements:
      host:
        - python
      run:
        - {{ pin_subpackage('importlib-metadata', max_pin="x.x.x") }}
    test:
      imports:
        - importlib_metadata

about:
  home: https://github.com/python/importlib_metadata
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: A library to access the metadata for a Python package

extra:
  recipe-maintainers:
    - nehaljwani
    - nicoddemus
    - marcelotrevisani
